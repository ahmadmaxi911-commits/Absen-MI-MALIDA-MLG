<!doctype html><html lang="id"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Absensi Guru</title><style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#17202b;--muted:#6b7280;--brand:#123c5a;--line:#e4e8ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px 18px 50px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.title{font-size:30px;font-weight:900}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:13px;box-shadow:0 8px 25px rgba(20,30,50,.04)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8fafc;padding:15px;border-radius:15px}.stat b{display:block;font-size:26px;margin-top:4px}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.field{display:grid;gap:5px}input,select{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}button{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff}.soft{background:#edf1f5}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:13px}.users{display:grid;gap:7px}.u{display:grid;grid-template-columns:1.5fr 1fr 100px 100px auto;gap:9px;align-items:center;padding:11px;border-bottom:1px solid var(--line)}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#eaf7ef}.off{background:#f0f1f3}.login{min-height:90vh;display:flex;align-items:center}.msg{margin-top:9px;color:#b42318}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.u{grid-template-columns:1fr auto auto}.u .meta{display:none}}
</style></head><body><div class="wrap">
<div id="login" class="login"><div class="card" style="max-width:420px;width:100%"><h2>Admin Absensi</h2><div class="muted">Masuk dengan akun administrator.</div><input id="id" placeholder="ID Admin"><input id="pin" type="password" placeholder="PIN"><button class="primary" style="width:100%" onclick="login()">Masuk</button><div id="lm" class="msg"></div></div></div>
<div id="app" style="display:none"><div class="top"><div><div class="muted">Dashboard</div><div class="title" id="school"></div></div><button class="soft" onclick="logout()">Keluar</button></div>
<div class="card"><div class="controls"><div class="field">Mulai<input id="start" type="date"></div><div class="field">Sampai<input id="end" type="date"></div><button class="primary" onclick="load()">Tampilkan</button><button class="soft" onclick="csv()">Ekspor CSV</button></div></div>
<div class="grid"><div class="stat"><span class="muted">Guru aktif</span><b id="a">0</b></div><div class="stat"><span class="muted">Total absensi</span><b id="b">0</b></div><div class="stat"><span class="muted">Hari</span><b id="c">0</b></div><div class="stat"><span class="muted">Rata-rata/hari</span><b id="d">0</b></div></div>
<div class="card"><h3>Rekap</h3><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Jam</th><th>Nama</th><th>Tipe</th><th>Jarak</th><th>Foto</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="card"><h3>Data Guru</h3><div class="controls"><input id="uid" placeholder="ID"><input id="un" placeholder="Nama"><input id="uj" placeholder="Jabatan"><input id="ue" placeholder="Email"><input id="up" placeholder="PIN"><button class="primary" onclick="save()">Simpan</button></div><div id="users" class="users"></div></div>
<div class="card"><h3>Pengaturan Sekolah</h3><div class="controls"><input id="sn" placeholder="Nama sekolah"><input id="lat" placeholder="Latitude"><input id="lng" placeholder="Longitude"><input id="rad" placeholder="Radius meter"><input id="cis" placeholder="Masuk mulai"><input id="cie" placeholder="Masuk selesai"><input id="cos" placeholder="Pulang mulai"><input id="coe" placeholder="Pulang selesai"><button class="primary" onclick="saveSettings()">Simpan</button></div></div>
</div></div><script>
let token=localStorage.getItem('adminToken');const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=new Date();$('start').value=iso(new Date(now.getFullYear(),now.getMonth(),1));$('end').value=iso(now);
function login(){google.script.run.withSuccessHandler(r=>{token=r.token;localStorage.setItem('adminToken',token);boot(r)}).withFailureHandler(e=>$('lm').textContent=e.message).login($('id').value,$('pin').value)}
function boot(r){if(r.user.role!=='ADMIN'){localStorage.removeItem('adminToken');$('lm').textContent='Akun bukan admin.';return}$('login').style.display='none';$('app').style.display='block';fillSettings(r.settings);load();loadUsers()}
function load(){google.script.run.withSuccessHandler(r=>{rows.innerHTML=r.length?r.map(x=>`<tr><td>${x.tanggal}</td><td>${x.jam}</td><td>${esc(x.nama)}</td><td>${x.tipe}</td><td>${x.distanceMeter} m</td><td>${x.photoUrl?`<a target="_blank" href="${x.photoUrl}">Buka</a>`:'-'}</td></tr>`).join(''):'<tr><td colspan="6">Belum ada data.</td></tr>'}).report(token,$('start').value,$('end').value);google.script.run.withSuccessHandler(s=>{a.textContent=s.activeUsers;b.textContent=s.total;c.textContent=s.days;d.textContent=s.avg}).summary(token,$('start').value,$('end').value)}
function loadUsers(){google.script.run.withSuccessHandler(list=>users.innerHTML=list.map(u=>`<div class="u"><div><b>${esc(u.nama)}</b><div class="muted">${esc(u.id)}</div></div><div class="meta">${esc(u.jabatan)}</div><div class="badge ${u.aktif?'':'off'}">${u.aktif?'Aktif':'Nonaktif'}</div><button class="soft" onclick='edit(${JSON.stringify(u)})'>Edit</button><button class="soft" onclick="toggle('${u.id}',${!u.aktif})">${u.aktif?'Nonaktifkan':'Aktifkan'}</button></div>`).join('')).getUsersAdmin(token)}
function edit(u){uid.value=u.id;un.value=u.nama;uj.value=u.jabatan;ue.value=u.email;up.value=u.pin}
function save(){google.script.run.withSuccessHandler(()=>{loadUsers();alert('Data tersimpan')}).saveUser(token,{id:uid.value,nama:un.value,jabatan:uj.value,email:ue.value,pin:up.value,aktif:true,role:'GURU'})}
function toggle(id,x){google.script.run.withSuccessHandler(loadUsers).setUserActive(token,id,x)}
function fillSettings(s){school.textContent=s.schoolName;sn.value=s.schoolName;lat.value=s.latitude;lng.value=s.longitude;rad.value=s.radiusMeter;cis.value=s.checkInStart;cie.value=s.checkInEnd;cos.value=s.checkOutStart;coe.value=s.checkOutEnd}
function saveSettings(){google.script.run.withSuccessHandler(fillSettings).saveSettings(token,{schoolName:sn.value,latitude:lat.value,longitude:lng.value,radiusMeter:rad.value,checkInStart:cis.value,checkInEnd:cie.value,checkOutStart:cos.value,checkOutEnd:coe.value})}
function csv(){google.script.run.withSuccessHandler(b64=>{const a=document.createElement('a');a.href='data:text/csv;base64,'+b64;a.download='rekap_absensi.csv';a.click()}).exportCsv(token,$('start').value,$('end').value)}
function logout(){google.script.run.logout(token);localStorage.removeItem('adminToken');location.reload()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
if(token)google.script.run.withSuccessHandler(r=>{if(r.user.role==='ADMIN')boot(r)}).withFailureHandler(()=>localStorage.removeItem('adminToken')).login('','');
</script></body></html>
