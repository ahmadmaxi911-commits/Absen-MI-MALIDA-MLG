<!doctype html><html lang="id"><head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Absensi Guru</title><style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#17202b;--muted:#6b7280;--brand:#123c5a;--line:#e5e9ef;--ok:#18864b;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:720px;margin:auto;padding:16px 15px 45px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.logo{font-weight:850;font-size:20px}.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:13px;box-shadow:0 8px 25px rgba(20,30,50,.045)}h1{font-size:27px;margin:3px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#f8fafc;border-radius:15px;padding:13px}.stat b{display:block;font-size:21px;margin-top:2px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:5px 0 9px}button{border:0;border-radius:13px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff;width:100%}.soft{background:#edf1f5}.row{display:flex;gap:8px}.row>*{flex:1}video,img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:#101010}#map{height:210px;border-radius:16px;background:#e8edf2;margin-top:9px}.people{display:grid}.person{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.badge{background:#eaf7ef;color:var(--ok);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.msg{display:none;padding:11px;border-radius:13px;margin-top:9px}.ok{display:block;background:#eaf7ef;color:#146c43}.err{display:block;background:#fdecea;color:var(--bad)}.hidden{display:none!important}.login{min-height:92vh;display:flex;align-items:center}.logout{color:var(--muted);font-size:13px;cursor:pointer}
</style><script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"></script></head><body>
<div class="wrap">
<div id="loginView" class="login"><div class="card" style="width:100%"><div class="logo">Absensi Guru</div><h1>Masuk</h1><div class="muted">Gunakan ID dan PIN akun sekolah.</div><input id="lid" placeholder="ID Guru"><input id="lpin" type="password" placeholder="PIN"><button class="primary" onclick="login()">Masuk</button><div id="loginMsg" class="msg"></div></div></div>
<div id="app" class="hidden">
<div class="top"><div><div class="logo" id="school"></div><div class="muted" id="who"></div></div><span class="logout" onclick="logout()">Keluar</span></div>
<div class="card"><div class="muted" id="date"></div><h1 id="clock"></h1><div class="grid"><div class="stat"><span class="muted">Masuk</span><b id="inStatus">—</b></div><div class="stat"><span class="muted">Pulang</span><b id="outStatus">—</b></div></div></div>
<div class="card"><h3>Foto verifikasi</h3><input id="photo" type="file" accept="image/*" capture="user"><img id="preview" class="hidden"></div>
<div class="card"><h3>Lokasi</h3><button class="soft" onclick="locate()">📍 Ambil lokasi sekarang</button><div id="map"></div><div id="locText" class="muted" style="margin-top:8px">Belum diambil.</div></div>
<div class="card"><div class="row"><button class="primary" id="inBtn" onclick="send('MASUK')">Absen Masuk</button><button class="soft" id="outBtn" onclick="send('PULANG')">Absen Pulang</button></div><div id="msg" class="msg"></div></div>
<div class="card"><h3>Yang sudah absen masuk</h3><div id="people" class="people"></div></div>
<div class="card"><h3>Riwayat saya hari ini</h3><div id="mine" class="muted"></div></div>
</div></div><script>
let token=localStorage.getItem('absenToken'),settings,coords,photoData,map,marker;
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('date').textContent=d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}setInterval(tick,1000);tick();
$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photoData=r.result;$('preview').src=photoData;$('preview').classList.remove('hidden')};r.readAsDataURL(f)};
function login(){google.script.run.withSuccessHandler(r=>{token=r.token;localStorage.setItem('absenToken',token);boot(r)}).withFailureHandler(e=>msg('loginMsg',e.message||e,true)).login($('lid').value,$('lpin').value)}
function boot(r){settings=r.settings;$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('school').textContent=settings.schoolName;$('who').textContent=r.user.nama+' • '+r.user.jabatan;refresh();initMap(settings.latitude,settings.longitude)}
function refresh(){google.script.run.withSuccessHandler(r=>{const m=r.mine;$('inStatus').textContent=m.find(x=>x.tipe==='MASUK')?.jam||'Belum';$('outStatus').textContent=m.find(x=>x.tipe==='PULANG')?.jam||'Belum';$('people').innerHTML=r.people.length?r.people.map(x=>`<div class="person"><span>${esc(x.nama)}</span><span class="badge">${esc(x.jam)}</span></div>`).join(''):'<span class="muted">Belum ada.</span>';$('mine').innerHTML=m.length?m.map(x=>`${x.tipe} • ${x.jam} • ${x.distanceMeter} m`).join('<br>'):'Belum ada absensi.'}).withFailureHandler(e=>{if(/Sesi/.test(e.message))location.reload();}).getToday(token)}
function locate(){if(!navigator.geolocation)return msg('msg','Browser tidak mendukung GPS.',true);navigator.geolocation.getCurrentPosition(p=>{coords={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy};$('locText').textContent=`${coords.latitude.toFixed(6)}, ${coords.longitude.toFixed(6)} • akurasi ±${Math.round(coords.accuracy)} m`;if(map){map.setCenter({lat:coords.latitude,lng:coords.longitude});map.setZoom(18);if(marker)marker.setMap(null);marker=new google.maps.Marker({position:{lat:coords.latitude,lng:coords.longitude},map,title:'Lokasi Anda'})}},()=>msg('msg','Izin lokasi gagal. Aktifkan GPS dan izinkan browser.',true),{enableHighAccuracy:true,timeout:10000,maximumAge:0})}
function initMap(lat,lng){if(!window.google)return;map=new google.maps.Map($('map'),{center:{lat,lng},zoom:17,disableDefaultUI:true});new google.maps.Marker({position:{lat,lng},map,title:'Sekolah'})}
function send(tipe){if(!photoData)return msg('msg','Ambil foto kamera terlebih dahulu.',true);if(!coords)return msg('msg','Ambil lokasi GPS terlebih dahulu.',true);$('inBtn').disabled=$('outBtn').disabled=true;google.script.run.withSuccessHandler(r=>{msg('msg',`${r.tipe} berhasil • ${r.jam} • ${r.distance} m`,false);refresh();$('inBtn').disabled=$('outBtn').disabled=false}).withFailureHandler(e=>{msg('msg',e.message||e,true);$('inBtn').disabled=$('outBtn').disabled=false}).submitAttendance(token,{tipe,photoData,latitude:coords.latitude,longitude:coords.longitude,accuracy:coords.accuracy,device:navigator.userAgent})}
function logout(){google.script.run.logout(token);localStorage.removeItem('absenToken');location.reload()}
function msg(id,x,err){$(id).textContent=x;$(id).className='msg '+(err?'err':'ok')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
if(token)google.script.run.withSuccessHandler(boot).withFailureHandler(()=>localStorage.removeItem('absenToken')).login; 
// Restore session by requesting today's data; login screen remains if token is stale.
if(token){google.script.run.withSuccessHandler(r=>{boot({token,user:{nama:r.mine[0]?.nama||'Guru',jabatan:'',role:'GURU'},settings:r.settings})}).withFailureHandler(()=>localStorage.removeItem('absenToken')).getToday(token)}
</script></body></html>
